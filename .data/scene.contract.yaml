name: "scene-1"

scene:
  unit: "px"
  max_time: 12
  precision: 1
  size: "600 400"
  style:
    background: "#fff"
    # background: "#242424"

objects:
  - id: "first_prompt"
    shape: "textbox"
    size: "420 200"
    position: "150 50"
    content: "I want to invest my €20,000 in savings for five years. I do not want high risk."
    style:
      fill: "#008080"
      wrap: true
      font-size: 24
      font-family: "SFUI"
      line-height: 1.

  - id: "first_response"
    shape: "textbox"
    size: "450 300"
    position: "20 190"
    content: "Let’s explore capital preservation, regular income, and growth separately."
    style:
      fill: "#008080"
      wrap: true
      font-size: 24
      font-family: "SFUI"
      line-height: 1.1

  - id: "first_branch_frame"
    shape: "rect"
    size: "150 200"
    position: "35 58"
    group: "g:first_branch"
    style:
      stroke: "#008080"
      fill: "none"
      stroke-width: 2.5

  - id: "first_branch_prompt_skeleton"
    shape: "skeleton"
    group: "g:first_branch"
    animation:
      name: "shimmer"
      angle: 45
      opacity: 0.5
      duration: 2
      loop: true
    position: "73 70"
    size: "100 35"
    rows:
      - id: "first_branch_prompt_skeleton_1"
        width: 80
      - id: "first_branch_prompt_skeleton_2"
      - id: "first_branch_prompt_skeleton_3"
        width: 35
    style:
      fill: "#b2dbdb"
      gap: 5
      align: "right"

  - id: "first_branch_response_skeleton"
    shape: "skeleton"
    group: "g:first_branch"
    position: "50 120"
    size: "120 68"
    animation:
      name: "shimmer"
      angle: 45
      opacity: 0.5
      duration: 2
      loop: true
    rows:
      - id: "first_branch_response_skeleton_1"
        width: "70%"
      - id: "first_branch_response_skeleton_2"
      - id: "first_branch_response_skeleton_3"
        width: "60%"
      - id: "first_branch_response_skeleton_4"
        width: "85%"
      - id: "first_branch_response_skeleton_5"
        width: "75%"
    style:
      fill: "#008080"
      gap: 5

  - id: "second_branch_frame"
    shape: "rect"
    size: "150 200"
    position: "223 58"
    group: "g:second_branch"
    style:
      stroke: "#008080"
      fill: "none"
      stroke-width: 2.5

  - id: "second_branch_prompt_skeleton"
    shape: "skeleton"
    group: "g:second_branch"
    animation:
      name: "shimmer"
      angle: 45
      opacity: 0.5
      duration: 1
      loop: true
    position: "260 70"
    size: "100 35"
    rows:
      - id: "second_branch_prompt_skeleton_1"
        width: 80
      - id: "second_branch_prompt_skeleton_2"
      - id: "second_branch_prompt_skeleton_3"
        width: 35
    style:
      fill: "#b2dbdb"
      gap: 5
      align: "right"

  - id: "second_branch_response_skeleton"
    shape: "skeleton"
    group: "g:second_branch"
    position: "235 120"
    size: "120 68"
    animation:
      name: "shimmer"
      angle: 45
      opacity: 0.5
      duration: 2
      loop: true
    rows:
      - id: "second_branch_response_skeleton_1"
        width: "70%"
      - id: "second_branch_response_skeleton_2"
      - id: "second_branch_response_skeleton_3"
        width: "60%"
      - id: "second_branch_response_skeleton_4"
        width: "85%"
      - id: "second_branch_response_skeleton_5"
        width: "75%"
    style:
      fill: "#008080"
      gap: 5

  - id: "third_branch_frame"
    shape: "rect"
    size: "150 200"
    position: "410 58"
    group: "g:third_branch"
    style:
      stroke: "#008080"
      fill: "none"
      stroke-width: 2.5

  - id: "third_branch_prompt_skeleton"
    shape: "skeleton"
    group: "g:third_branch"
    animation:
      name: "shimmer"
      angle: 45
      opacity: 0.5
      duration: 1
      loop: true
    position: "447 70"
    size: "100 35"
    rows:
      - id: "third_branch_prompt_skeleton_1"
        width: 80
      - id: "third_branch_prompt_skeleton_2"
      - id: "third_branch_prompt_skeleton_3"
        width: 35
    style:
      fill: "#b2dbdb"
      gap: 5
      align: "right"

  - id: "third_branch_response_skeleton"
    shape: "skeleton"
    position: "423 120"
    group: "g:third_branch"
    size: "120 68"
    animation:
      name: "shimmer"
      angle: 45
      opacity: 0.5
      duration: 2
      loop: true
    rows:
      - id: "third_branch_response_skeleton_1"
        width: "70%"
      - id: "third_branch_response_skeleton_2"
      - id: "third_branch_response_skeleton_3"
        width: "60%"
      - id: "third_branch_response_skeleton_4"
        width: "85%"
      - id: "third_branch_response_skeleton_5"
        width: "75%"
    style:
      fill: "#008080"
      gap: 5

  - id: "fork_wire"
    shape: "straight"
    coords: "300 233 | 300 350"
    forks:
      - id: "fork_1"
        coords: "300 350 | 485 350 | 485 370"
      - id: "fork_2"
        coords: "300 350 | 300 350 | 300 370"
      - id: "fork_3"
        coords: "300 350 | 110 350 | 110 370"
    style:
      fill: "none"
      stroke: "#008080"
      stroke-width: 2.5
      stroke-linecap: "round"

  - id: "my_ellipse"
    shape: "ellipse"
    size: "250"
    style:
      fill: "#e2e2e2"

timelines:
  - id: "t_1"
    moments:
      - id: "writes_first_prompt"
        start: 0
        end: 1
        ease: "inOutCubic"
        z_index: 2
        operations:
          - name: "typewriter"
            select: "first_prompt"
          - name: "font-resize"
            select: "first_prompt"
            size: "24 -> 36"

      - id: "writes_first_response"
        start: 1
        end: 2
        ease: "inOutCubic"
        z_index: 2
        operations:
          - name: "typewriter"
            select: "first_response"
          - name: "font-resize"
            select: "first_response"
            size: "24 -> 36"

      - id: "underlines_response"
        start: 2
        end: 2.6
        ease: "inOutCubic"
        z_index: 2
        operations:
          - name: "underline"
            select: "first_response"
            match: "capital preservation"
            style:
              color: "#008080"
              stroke-width: 3
          - name: "underline"
            select: "first_response"
            match: "regular income"
            style:
              color: "#008080"
              stroke-width: 3
          - name: "underline"
            select: "first_response"
            match: "growth"
            style:
              color: "#008080"
              stroke-width: 3
          - name: "mark"
            select: "first_response"
            match: "regular income"
            style:
              background-color: "#e2e2e2"
          - name: "mark"
            select: "first_response"
            match: "growth"
            style:
              background-color: "#e2e2e2"
          - name: "mark"
            select: "first_response"
            match: "capital preservation"
            style:
              background-color: "#e2e2e2"
          - name: "mark"
            select: "first_response"
            match: "separately."
            style:
              color: "#fff"
              background-color: "#008080"
              transition: "color"

      - id: "fork_from_word"
        start: 2
        end: 5
        ease: "inOutCubic"
        z_index: 2
        operations:
          - name: "draw"
            select: "fork_wire"

      - id: "moving_texts_up"
        start: 3
        end: 6
        ease: "inOutCubic"
        z_index: 2
        operations:
          - name: "move"
            select: "first_prompt"
            location: "150 50 -> 150 -250"
          - name: "move"
            select: "first_response"
            location: "20 170 -> 20 -200"
          - name: "move"
            select: "fork_wire"
            location: "300 290 -> 300 -80"

      - id: "fork_fanout_to_three"
        start: 4
        end: 6
        ease: "inOutCubic"
        z_index: 2
        operations:
          - name: "draw"
            select: "fork_1"
          - name: "draw"
            select: "fork_2"
          - name: "draw"
            select: "fork_3"

      - id: "branches_appear"
        start: 5
        end: 6
        ease: "inOutCubic"
        z_index: 2
        operations:
          - name: "move"
            select: "g:first_branch"
            location: "35 78 -> 35 58"
          - name: "move"
            select: "g:second_branch"
            location: "223 98 -> 223 58"
          - name: "move"
            select: "g:third_branch"
            location: "410 118 -> 410 58"
          - name: "fadeIn"
            select: "g:first_branch"
          - name: "fadeIn"
            select: "g:second_branch"
          - name: "fadeIn"
            select: "g:third_branch"

      - id: "prompts_appear"
        start: 6
        end: 6.5
        ease: "inOutCubic"
        z_index: 2
        operations:
          - name: "move"
            select: "first_branch_prompt_skeleton"
            location: "10 0 -> 0 0"
          - name: "move"
            select: "second_branch_prompt_skeleton"
            location: "10 0 -> 0 0"
          - name: "move"
            select: "third_branch_prompt_skeleton"
            location: "10 0 -> 0 0"
          - name: "fadeIn"
            select: "first_branch_prompt_skeleton"
          - name: "fadeIn"
            select: "second_branch_prompt_skeleton"
          - name: "fadeIn"
            select: "third_branch_prompt_skeleton"

      - id: "responses_appear"
        start: 6
        end: 7.5
        ease: "inOutCubic"
        z_index: 2
        operations:
          - name: "move"
            select: "first_branch_response_skeleton"
            location: "-10 0 -> 0 0"
          - name: "move"
            select: "second_branch_response_skeleton"
            location: "-10 0 -> 0 0"
          - name: "move"
            select: "third_branch_response_skeleton"
            location: "-10 0 -> 0 0"
          - name: "fadeIn"
            select: "first_branch_response_skeleton"
          - name: "fadeIn"
            select: "second_branch_response_skeleton"
          - name: "fadeIn"
            select: "third_branch_response_skeleton"

      - id: "loop_the_circle"
        start: 0
        end: 4
        z_index: 0
        loop: true
        operations:
          - name: "move"
            select: "my_ellipse"
            location: "-250 70 -> 850 70"
