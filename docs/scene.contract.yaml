name: "scene-1"

scene:
  unit: "px"
  max_time: 60
  precision: 1
  size: "600 400"
ayne
objects:
  - id: "branch_box"
    shape: "rect"
    styles:
      rounded: 20
      stroke: "red"
  - id: "wire"
    shape: "rect"
  - id: "my_ellipse"
    shape: "ellipse"
    size: "250"
    style:
      fill: "#FFC517"
    group: "g:test_group"
  - id: "test_box"
    shape: "rect"
    size: "50"
    group: "g:test_group"

timelines:
  - id: "t_1"
    moments:
      - id: "branch_appear"
        start: 0
        end: 1
        ease: "inOutCubic"
        z_index: 2
        operation:
          - name: "scale"
            select: "branch_box"
            dimensions: "0 -> 300 200"
            location: "20 20"

      - id: "branch_fork"
        start: 2
        end: 4
        z_index: 2
        operation:
          - name: "scale"
            select: "wire"
            dimensions: "2 0 -> 2 30"
            location: "170 200"

      - id: "move_sun"
        start: 0
        end: 5
        z_index: 0
        loop: true
        operation:
          - name: "move"
            select: "my_ellipse"
            location: "-50 -150 -> 650 -150"
