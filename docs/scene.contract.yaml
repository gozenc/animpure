name: "scene-1"

scene:
  unit: "px"
  max_time: 60
  precision: 1
  size: "600 400"

objects:
  - id: "branch_box"
    shape: "rect"
    style:
      rounded: 20
      fill: "none"
      stroke: "red"
      stroke-width: 2
  - id: "wire"
    shape: "rect"
  - id: "my_ellipse"
    shape: "ellipse"
    size: "250"
    style:
      fill: "#FFC517"
    group: "g:test_group"
  - id: "test_box"
    shape: "rect"
    size: "50"
    group: "g:test_group"

timelines:
  - id: "t_1"
    moments:
      - id: "branch_appear"
        start: 0
        end: 2
        ease: "inOutCubic"
        z_index: 2
        operations:
          - name: "scale"
            select: "branch_box"
            dimensions: "0 -> 300 200"
            location: "20 20"

      - id: "branch_fork"
        start: 2
        end: 3
        z_index: 2
        operations:
          - name: "scale"
            select: "wire"
            dimensions: "1 0 -> 1 30"
            location: "170 220"

      - id: "move_sun"
        start: 0
        end: 3
        z_index: 0
        loop: true
        operations:
          - name: "move"
            select: "my_ellipse"
            location: "-250 -150 -> 850 -150"
