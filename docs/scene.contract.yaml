name: "scene-1"

scene:
  unit: "px"
  max_time: 6
  precision: 1
  size: "600 400"
  style:
    background: "#F5F5F5"

objects:
  - id: "first_prompt"
    shape: "textbox"
    size: "420 200"
    position: "150 50"
    content: "I want to invest my €20,000 in savings for five years. I do not want high risk."
    style:
      fill: "#008080"
      wrap: true
      font-size: 24
      font-family: "SFUI"
      line-height: 1

  - id: "first_response"
    shape: "textbox"
    size: "450 300"
    position: "20 190"
    content: "Let’s explore capital preservation, regular income, and growth separately."
    style:
      fill: "#008080"
      wrap: true
      font-size: 24
      font-family: "SFUI"
      line-height: 1

  - id: "branch_box"
    shape: "rect"
    style:
      rounded: 20
      fill: "none"
      stroke: "#008080"
      stroke-width: 2

  - id: "fork_wire"
    shape: "straight"
    coords: "300 295 | 300 600"
    forks:
      - id: "fork_1"
        coords: "300 600 | 350 600"
      - id: "fork_2"
        coords: "300 600 | 300 650"
      - id: "fork_3"
        coords: "300 600 | 250 600"
    style:
      fill: "none"
      stroke: "#008080"
      stroke-width: 2.5
      stroke-linecap: "round"

  - id: "my_ellipse"
    shape: "ellipse"
    size: "250"
    style:
      fill: "#FFC517"

timelines:
  - id: "t_1"
    moments:
      - id: "writes_first_prompt"
        start: 0
        end: 1
        ease: "inOutCubic"
        z_index: 2
        operations:
          - name: "typewriter"
            select: "first_prompt"
          - name: "font-resize"
            select: "first_prompt"
            size: "24 -> 36"

      - id: "writes_first_response"
        start: 1
        end: 2
        ease: "inOutCubic"
        z_index: 2
        operations:
          - name: "typewriter"
            select: "first_response"
          - name: "font-resize"
            select: "first_response"
            size: "24 -> 36"

      - id: "underline_response"
        start: 2
        end: 2.6
        ease: "inOutCubic"
        z_index: 2
        operations:
          - name: "underline"
            select: "first_response"
            match: "capital preservation"
          - name: "underline"
            select: "first_response"
            match: "regular income"
          - name: "underline"
            select: "first_response"
            match: "growth"
          - name: "mark"
            select: "first_response"
            match: "capital preservation"
            background-color: "#FFC517"

      - id: "fork_branch"
        start: 1
        end: 3
        ease: "inOutCubic"
        z_index: 2
        operations:
          - name: "draw"
            select: "fork_wire"

      - id: "moving_up"
        start: 2
        end: 5
        ease: "inOutCubic"
        z_index: 2
        operations:
          - name: "move"
            select: "first_prompt"
            location: "150 50 -> 150 -250"
          - name: "move"
            select: "first_response"
            location: "20 190 -> 20 -200"
          - name: "move"
            select: "fork_wire"
            location: "300 295 -> 300 0"

      - id: "move_sun"
        start: 0
        end: 3
        z_index: 0
        loop: true
        operations:
          - name: "move"
            select: "my_ellipse"
            location: "-250 0 -> 850 0"
