name: "scene-1"

scene:
  unit: "px"
  max_time: 3
  precision: 1
  size: "600 400"
  style:
    background: "#F5F5F5"

objects:
  - id: "first_prompt"
    shape: "textbox"
    size: "420 200"
    position: "100 50"
    content: "I want to invest my €20,000 in savings for five years. I do not want high risk."
    style:
      fill: "#008080"
      wrap: true
      font-size: 24
      font-family: "Nunito Sans"
  - id: "first_response"
    shape: "textbox"
    size: "420 200"
    position: "100 250"
    content: "Let’s examine the goals of ↓ capital preservation, ↓ steady income, and ↓ growth separately."
    style:
      fill: "#008080"
      wrap: true
      font-size: 24
      font-family: "Nunito Sans"
  - id: "branch_box"
    shape: "rect"
    style:
      rounded: 20
      fill: "none"
      stroke: "#008080"
      stroke-width: 2
  - id: "wire"
    shape: "rect"
    style:
      fill: "#008080"
  - id: "my_ellipse"
    shape: "ellipse"
    size: "250"
    style:
      fill: "#FFC517"

timelines:
  - id: "t_1"
    moments:
      - id: "writes_cta"
        start: 0
        end: 1
        ease: "inOutCubic"
        z_index: 2
        operations:
          - name: "typewriter"
            select: "first_prompt"
          - name: "font-resize"
            select: "first_prompt"
            size: "24 -> 36"

      - id: "branch_appear"
        start: 0
        end: 1
        ease: "inOutCubic"
        z_index: 2
        operations:
          - name: "scale"
            select: "branch_box"
            dimensions: "0 -> 300 200"
            location: "20 20"

      - id: "branch_fork"
        start: 1
        end: 1.5
        z_index: 2
        ease: "inOutCubic"
        operations:
          - name: "scale"
            select: "wire"
            dimensions: "2 0 -> 2 30"
            location: "170 220"

      - id: "move_sun"
        start: 0
        end: 3
        z_index: 0
        loop: true
        operations:
          - name: "move"
            select: "my_ellipse"
            location: "-250 -150 -> 850 -150"
